<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library System</title>
</head>
<body>

  <h2>Library Book Summary</h2>

  <script>
    // Create the book object
    const book = {
      title: "The Alchemist",
      author: "Paulo Coelho",
      year: 1988,

      // Method to return summary
      getSummary: function () {
        return `The book '${this.title}' was written by ${this.author} in ${this.year}.`;
      }
    };

    // Function to display the summary
    function printBookSummary(bookObj) {
      console.log(bookObj.getSummary());

      // Display on webpage
      document.write(bookObj.getSummary());
    }

    // Call the function
    printBookSummary(book);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bakery Feedback Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">Online Bakery Feedback Form</h2>

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Customer Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <!-- Feedback -->
            <div class="mb-3">
                <label class="form-label">Feedback Message</label>
                <textarea class="form-control" rows="4" placeholder="Write your feedback"></textarea>
            </div>

            <!-- Preferred Contact Method -->
            <div class="mb-3">
                <label class="form-label d-block">Preferred Contact Method</label>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="contact">
                    <label class="form-check-label">Email</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="contact">
                    <label class="form-check-label">Phone</label>
                </div>
            </div>

            <!-- Satisfaction Level -->
            <div class="mb-3">
                <label class="form-label">Satisfaction Level (1-10)</label>
                <input type="range" class="form-range" min="1" max="10">
            </div>

            <!-- Order Type -->
            <div class="mb-4">
                <label class="form-label">Type of Order</label>

                <select class="form-select">
                    <option>Cake</option>
                    <option>Cookies</option>
                    <option>Pastries</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button class="btn btn-primary w-100">
                Submit Feedback
            </button>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up Form</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>

<body class="bg-primary d-flex align-items-center vh-100">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="bg-white p-4 rounded">

                    <h1 class="font-weight-bold display-4">
                        Sign Up
                    </h1>

                    <p class="text-muted h5 mb-4">
                        Please fill in this form to create an account!
                    </p>

                    <form>

                        <div class="form-row">

                            <div class="form-group col-md-6">
                                <input type="text"
                                class="form-control bg-light border-0"
                                placeholder="First Name">
                            </div>

                            <div class="form-group col-md-6">
                                <input type="text"
                                class="form-control bg-light border-0"
                                placeholder="Last Name">
                            </div>

                        </div>

                        <div class="form-group">
                            <input type="email"
                            class="form-control bg-light border-0"
                            placeholder="Email">
                        </div>

                        <div class="form-group">
                            <input type="password"
                            class="form-control bg-light border-0"
                            placeholder="Password">
                        </div>

                        <div class="form-group">
                            <input type="password"
                            class="form-control bg-light border-0"
                            placeholder="Confirm Password">
                        </div>

                        <div class="form-group form-check">

                            <input type="checkbox"
                            class="form-check-input"
                            id="check">

                            <label class="form-check-label text-secondary" for="check">

                                I accept the

                                <a href="#" class="font-weight-bold">
                                    Terms of Use
                                </a>

                                &

                                <a href="#" class="font-weight-bold">
                                    Privacy Policy
                                </a>

                            </label>

                        </div>

                        <button type="submit"
                        class="btn btn-primary px-5">
                            Sign Up
                        </button>

                    </form>

                </div>

                <div class="bg-primary text-center text-white py-3">

                    Already have an account?

                    <a href="#" class="text-white font-weight-bold">
                        Login here.
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
